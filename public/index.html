<!doctype html>
<html lang="en" data-theme="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#140b24">
<script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("nritya_laya_theme")==="classic"?"classic":"night")}catch(e){}</script>
<title>Nritya Laya – Bharatanatyam Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Caveat:wght@500;600&family=Great+Vibes&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============ THEME TOKENS ============ */
:root{--bg:#fffaf3;--ivory:#fffaf3;--bg2:#ffffff;--surface:#ffffff;--paper:#f3f1ee;--peach:#fde8d6;
--ink:#3b2415;--muted:#7a6a5c;--head:#8b5a2b;--btn:#8b5a2b;--btn-text:#ffffff;--btn2-text:#ffffff;
--line:rgba(193,154,85,.3);--line2:rgba(193,154,85,.2);--line-strong:rgba(139,90,43,.45);--th:rgba(253,232,214,.7);--hover:#fffaf3;
--header-bg:rgba(255,255,255,.94);--inp:#ffffff;--shadow:0 1px 2px rgba(0,0,0,.05);--link-hover:#c8281e;
--hero:radial-gradient(ellipse at 20% 30%,rgba(245,158,43,.35),transparent 55%),radial-gradient(ellipse at 80% 80%,rgba(200,40,30,.5),transparent 60%),linear-gradient(120deg,#2a0705 0%,#6b130c 45%,#b3261e 100%);
--side:linear-gradient(180deg,#5c0f0b,#8f1d14);--footer-bg:#c19a55;--footer-text:#ffffff;--body-bg:#fffaf3;
--toast-bg:#3b2415;--toast-text:#ffffff;--backdrop:rgba(0,0,0,.45);
--orb1:rgba(245,158,43,.22);--orb2:rgba(200,40,30,.12);--orb3:rgba(193,154,85,.25);
--maroon:#5c0f0b;--burgundy:#8f1d14;--crimson:#c8281e;--orange:#f26a21;--amber:#f59e2b;--gold:#c19a55;--gold-deep:#a47e3a;
--success:#3f7d4e;--danger:#b3261e;--info:#2a6f97;--on-success:#ffffff;--on-danger:#ffffff;--on-info:#ffffff;color-scheme:light}
:root[data-theme=night]{--bg:#140b24;--ivory:#1a0f2e;--bg2:rgba(33,20,56,.55);--surface:#211438;--paper:#2a1a47;--peach:#33204f;
--ink:#f4ead8;--muted:#b9a9c9;--head:#e8c987;--btn:#e0b865;--btn-text:#2a1608;--btn2-text:#2a1608;
--line:rgba(232,201,135,.22);--line2:rgba(232,201,135,.13);--line-strong:rgba(232,201,135,.5);--th:rgba(232,201,135,.1);--hover:rgba(255,255,255,.04);
--header-bg:rgba(20,11,36,.86);--inp:#1a0f2e;--shadow:0 2px 10px rgba(0,0,0,.35);--link-hover:#ffb36b;
--hero:radial-gradient(ellipse at 15% 25%,rgba(245,158,43,.3),transparent 55%),radial-gradient(ellipse at 85% 75%,rgba(124,58,237,.38),transparent 60%),linear-gradient(120deg,#0d0618 0%,#2a1450 50%,#4a1f5e 100%);
--side:linear-gradient(180deg,#0d0618,#2a1450);--footer-bg:#0b0614;--footer-text:#e9dcc0;--body-bg:linear-gradient(180deg,#140b24 0%,#0f0819 100%);
--toast-bg:#f4ead8;--toast-text:#2a1608;--backdrop:rgba(5,2,12,.7);
--orb1:rgba(124,58,237,.5);--orb2:rgba(245,158,43,.3);--orb3:rgba(200,40,30,.28);
--gold-deep:#f0c36b;--success:#6fcf8a;--danger:#ff8a80;--info:#7cc4ff;--on-success:#0d2b16;--on-danger:#3a0905;--on-info:#06263d;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--body-bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;line-height:1.5;overflow-x:clip}
#app{position:relative;z-index:1;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
select option{background:var(--surface);color:var(--ink)}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.script{font-family:"Great Vibes","Segoe Script","Brush Script MT",cursive;font-weight:400}
.display{font-family:"Cormorant Garamond",Georgia,serif}
.hero-bg{background:var(--hero);color:#fff}
.paper-bg{background-color:var(--paper);background-image:radial-gradient(rgba(139,90,43,.06) 1px,transparent 1px);background-size:14px 14px}
:root[data-theme=night] .paper-bg{background-color:rgba(255,255,255,.035);background-image:radial-gradient(rgba(232,201,135,.12) 1px,transparent 1px)}
.kolam{height:3px;background-image:repeating-linear-gradient(90deg,var(--gold) 0 10px,transparent 10px 16px);transform-origin:left;animation:kgrow 1.4s ease both}
@keyframes kgrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px}
.muted{color:var(--muted)}
/* ============ BACKGROUND ORBS / PROGRESS ============ */
main{overflow-x:clip}
#orbs{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(80px);will-change:transform}
.o1{width:46vmax;height:46vmax;left:-14vmax;top:-12vmax;background:var(--orb1);transform:translateY(calc(var(--sy,0px)*-.05))}
.o2{width:38vmax;height:38vmax;right:-12vmax;top:32vh;background:var(--orb2);transform:translateY(calc(var(--sy,0px)*-.09))}
.o3{width:42vmax;height:42vmax;left:20vw;bottom:-22vmax;background:var(--orb3);transform:translateY(calc(var(--sy,0px)*-.04))}
#progress{position:fixed;top:0;left:0;right:0;height:3px;z-index:90;background:linear-gradient(90deg,var(--amber),var(--crimson),var(--gold));transform-origin:0 50%;transform:scaleX(0)}
/* ============ BUTTONS / BADGES / CARDS ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:999px;padding:8px 20px;font-size:14px;font-weight:600;cursor:pointer;background:var(--btn);color:var(--btn-text);transition:filter .15s,transform .15s,background .15s;white-space:nowrap}
.btn:hover{filter:brightness(.88)}
.btn:active{transform:scale(.97)}
.btn.gold{background:var(--gold);color:var(--btn2-text)}
.btn.ghost{background:transparent;border:1px solid var(--line-strong);color:var(--head)}.btn.ghost:hover{background:var(--peach);filter:none}
.btn.light{background:#fff;color:var(--maroon)}.btn.light:hover{background:var(--peach);filter:none}
.btn.danger{background:var(--danger);color:var(--on-danger)}
.btn.green{background:var(--success);color:var(--on-success)}
.btn.sm{padding:5px 14px;font-size:13px}
.btn.onhero{background:transparent;border:1px solid rgba(255,255,255,.6);color:#fff}.btn.onhero:hover{background:rgba(255,255,255,.12);filter:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.pad{padding:20px}
.badge{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600}
.b-success{background:rgba(63,125,78,.15);background:color-mix(in srgb,var(--success) 16%,transparent);color:var(--success)}
.b-danger{background:rgba(179,38,30,.13);background:color-mix(in srgb,var(--danger) 16%,transparent);color:var(--danger)}
.b-warn{background:rgba(245,158,43,.2);background:color-mix(in srgb,var(--amber) 22%,transparent);color:var(--gold-deep)}
.b-neutral{background:var(--paper)}
.b-info{background:rgba(42,111,151,.14);background:color-mix(in srgb,var(--info) 16%,transparent);color:var(--info)}
.sec-title{text-align:center;margin-bottom:40px}
.sec-title h2{font-size:clamp(38px,6vw,60px);color:var(--head);line-height:1.1}
.sec-title p{margin-top:8px;font-size:18px;color:var(--muted);max-width:640px;margin-inline:auto}
/* ============ PUBLIC HEADER / FOOTER ============ */
.pub-head{position:sticky;top:0;z-index:40;background:var(--header-bg);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);transition:box-shadow .3s}
.pub-head.scrolled{box-shadow:0 8px 30px rgba(0,0,0,.22)}
.pub-head .in{height:64px;display:flex;align-items:center;justify-content:space-between;gap:12px;transition:height .3s}
.pub-head.scrolled .in{height:56px}
.logo{display:flex;align-items:center;gap:8px;min-width:0}
.logo b{display:block;font-family:"Cormorant Garamond",Georgia,serif;font-size:22px;line-height:1.05;color:var(--head)}
.logo small{display:block;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.logo.light b{color:#fff}.logo.light small{color:rgba(255,255,255,.7)}
.pub-nav{display:none;gap:20px;font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--head)}
.pub-nav a{position:relative;padding:4px 0}
.pub-nav a:after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:2px;background:var(--gold);transform:scaleX(0);transform-origin:left;transition:transform .3s}
.pub-nav a:hover:after,.pub-nav a.on:after{transform:scaleX(1)}
.pub-nav a:hover,.pub-nav a.on{color:var(--link-hover)}
.pub-act{display:none;gap:10px;align-items:center}
.burger{background:none;border:0;font-size:26px;color:var(--head);cursor:pointer;padding:4px 8px;line-height:1}
.mob{display:flex;flex-direction:column;gap:0;max-height:0;overflow:hidden;opacity:0;background:var(--header-bg);backdrop-filter:blur(10px);font-size:15px;font-weight:600;color:var(--head);transition:max-height .45s ease,opacity .3s ease,padding .3s;padding:0 16px}
.mob a{padding:11px 0;border-bottom:1px solid var(--line2)}
.mob .row{padding-top:12px}
.mob.open{max-height:90vh;opacity:1;padding:6px 16px 16px;overflow:auto}
@media(min-width:1000px){.pub-nav{display:flex}.burger.pubb{display:none}.mob{display:none!important}}
@media(min-width:760px){.pub-act{display:flex}}
.pub-foot{background:var(--footer-bg);color:var(--footer-text);margin-top:auto;border-top:1px solid var(--line)}
.pub-foot .g{display:grid;gap:20px;padding:28px 16px;font-size:14px}
@media(min-width:760px){.pub-foot .g{grid-template-columns:repeat(3,1fr)}.pub-foot .r{text-align:right}}
.pub-foot ul{list-style:none;padding:0;display:grid;gap:6px}
.pub-foot a:hover{text-decoration:underline}
.pub-foot .copy{border-top:1px solid rgba(255,255,255,.2);text-align:center;font-size:12px;padding:12px}
.page-hero{position:relative;overflow:hidden}
.page-hero .in{padding:56px 16px}
.page-hero h1{font-size:clamp(42px,8vw,72px);line-height:1.05}
.page-hero p{margin-top:10px;font-size:clamp(16px,2.2vw,19px);color:rgba(255,255,255,.85);max-width:640px}
/* ============ ART / GRIDS ============ */
.art{position:relative;aspect-ratio:1;margin-inline:auto}
.art svg{position:absolute;inset:0;margin:auto;height:100%;width:100%}
.art .dancer{height:85%;width:auto;animation:sway 6s ease-in-out infinite;transform-origin:50% 90%}
@keyframes sway{50%{transform:rotate(1.6deg) translateY(-3px)}}
.cover{width:100%;height:100%;object-fit:cover;display:block}
.grid{display:grid;gap:24px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.tiles{display:grid;gap:14px;grid-template-columns:repeat(2,1fr)}
@media(min-width:640px){.tiles{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1000px){.tiles{grid-template-columns:repeat(4,1fr)}}
.hero-home{position:relative;overflow:hidden}
.hero-home .wrap{position:relative;z-index:1}
.hero-grid{display:grid;gap:32px;align-items:center;padding:64px 16px}
.hero-grid>*{min-width:0}
@media(min-width:800px){.hero-grid{grid-template-columns:1.1fr .9fr;padding:90px 16px}}
.par{transform:translateY(var(--py,0px));will-change:transform}
.hero-img{border-radius:24px;overflow:hidden;aspect-ratio:4/5;border:4px solid rgba(255,255,255,.25);box-shadow:0 20px 50px rgba(0,0,0,.4);max-width:420px;margin-inline:auto}
.shine{background:linear-gradient(90deg,#fff 0%,#f7dc9a 35%,#fff 55%,#f7dc9a 80%,#fff 100%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:shine 7s linear infinite}
@keyframes shine{to{background-position:-220% 0}}
.bell{position:absolute;z-index:0;pointer-events:none;width:var(--s,22px);height:var(--s,22px);border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff3c4,#c19a55 60%,#a47e3a);box-shadow:0 0 18px rgba(245,190,80,.6);animation:float var(--t,7s) ease-in-out infinite}
.bell.b1{top:14%;left:5%;--s:20px}.bell.b2{top:62%;left:46%;--s:14px;--t:9s}.bell.b3{bottom:12%;right:7%;--s:26px;--t:8s}
@keyframes float{50%{transform:translateY(-24px) rotate(10deg)}}
.marquee{overflow:hidden;white-space:nowrap;border-block:1px solid var(--line);background:var(--bg2);padding:14px 0}
.marquee .track{display:inline-flex;gap:44px;padding-left:44px;animation:marq 32s linear infinite}
.marquee span{font-family:"Cormorant Garamond",Georgia,serif;font-size:clamp(20px,3vw,28px);color:var(--head)}
.marquee span:nth-child(even){color:var(--gold)}
@keyframes marq{to{transform:translateX(-50%)}}
/* ============ SCROLL REVEAL ============ */
.rv{opacity:0;transform:translateY(30px);transition:opacity .75s ease var(--d,0s),transform .75s cubic-bezier(.2,.7,.2,1) var(--d,0s)}
.rv.rv-l{transform:translateX(-40px)}.rv.rv-r{transform:translateX(40px)}.rv.rv-z{transform:scale(.88)}
.rv.in{opacity:1;transform:none}
.cat-card.rv.in:hover,.grid>.card.rv.in:hover{transform:translateY(-6px);transition-delay:0s;box-shadow:0 18px 40px rgba(0,0,0,.25)}
.cat-card,.grid>.card{transition:box-shadow .3s}
.event-date{transform:skewX(-6deg);background:linear-gradient(90deg,var(--burgundy),var(--crimson));color:#fff;padding:16px 26px;text-align:center;min-width:120px}
.event-date small{font-size:10px;letter-spacing:.2em}
.event-date b{display:block;font-family:"Cormorant Garamond",serif;font-size:22px;line-height:1.2}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:28px}
.chip{border:1px solid var(--line-strong);background:var(--surface);border-radius:99px;padding:5px 16px;font-size:13px;cursor:pointer;color:var(--head);transition:background .2s}
.chip:hover{background:var(--peach)}
.chip.on{background:var(--btn);color:var(--btn-text);border-color:var(--btn)}
.cat-card{overflow:hidden;display:flex;flex-direction:column}
.cat-img{height:190px;background:var(--peach);position:relative;overflow:hidden;display:grid;place-items:center}
.cat-img .art{height:170px;width:170px}
.cat-img .cover,.tile .cover,.guru-ph .cover{transition:transform .7s ease}
.cat-card:hover .cat-img .cover,.tile:hover .cover,.card:hover .guru-ph .cover{transform:scale(1.08)}
.tile .art{transition:transform .6s ease}.tile:hover .art{transform:scale(1.07)}
.cat-body{padding:18px;display:flex;flex-direction:column;gap:8px;flex:1}
.cat-body h3{font-family:"Cormorant Garamond",serif;font-size:26px;color:var(--head);line-height:1.1}
.meta{display:flex;gap:8px;flex-wrap:wrap}
.guru-ph{width:150px;height:150px;border-radius:50%;overflow:hidden;margin:auto;background:var(--peach);position:relative;border:3px solid var(--gold)}
.guru-ph .art{width:100%}
.tile{aspect-ratio:1;border-radius:16px;overflow:hidden;background:var(--peach);position:relative;cursor:zoom-in;border:1px solid var(--line)}
.tile .cap{position:absolute;left:0;right:0;bottom:0;padding:24px 12px 10px;background:linear-gradient(transparent,rgba(20,6,30,.8));color:#fff;font-size:13px}
.tile .art{width:80%;top:10%}
.fab{position:fixed;right:max(18px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));z-index:70;box-shadow:0 6px 18px rgba(0,0,0,.35)}
/* ============ FORMS ============ */
.fld{display:grid;gap:4px;font-size:14px;font-weight:500}
.inp{width:100%;border:1px solid var(--line-strong);border-radius:10px;padding:8px 12px;background:var(--inp);color:var(--ink)}
.inp::placeholder{color:var(--muted)}
.form-grid{display:grid;gap:16px}
@media(min-width:700px){.form-grid.two{grid-template-columns:1fr 1fr}.span2{grid-column:span 2}}
.login{min-height:100vh;min-height:100dvh;display:grid}
@media(min-width:800px){.login{grid-template-columns:1fr 1fr}}
.login .left{display:none;align-items:center;justify-content:center;position:relative;overflow:hidden}
@media(min-width:800px){.login .left{display:flex}}
.login .right{display:flex;align-items:center;justify-content:center;padding:24px;background:transparent}
/* ============ PORTAL ============ */
.portal{display:flex;min-height:100vh;min-height:100dvh}
.side{width:262px;flex-shrink:0;background:var(--side);color:#fff;position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto;display:none;flex-direction:column}
@media(min-width:1000px){.side{display:flex}.menu-btn{display:none}}
.side .top{padding:16px}
.snav{display:grid;gap:2px;padding:12px 12px 24px}
.snav a{display:flex;align-items:center;gap:12px;border-radius:8px;padding:8px 12px;font-size:14px;color:rgba(255,255,255,.75);transition:background .2s,transform .2s}
.snav a:hover{background:rgba(255,255,255,.1);color:#fff;transform:translateX(3px)}
.snav a.on{background:rgba(255,255,255,.16);color:#fff;font-weight:600}
.snav a .ic{width:18px;text-align:center}
.drawer{position:fixed;inset:0;z-index:60;display:none}
.drawer.open{display:flex}
.drawer .panel{width:min(300px,84vw);background:var(--side);color:#fff;overflow-y:auto;animation:slidein .3s ease}
@keyframes slidein{from{transform:translateX(-100%)}}
.drawer .back{flex:1;background:var(--backdrop);border:0}
.main-col{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;min-height:64px;background:var(--header-bg);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:8px 16px;gap:12px}
.topbar .t b{font-family:"Cormorant Garamond",serif;font-size:22px;color:var(--head);display:block;line-height:1}
.topbar .t small{font-size:11px;color:var(--muted)}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--amber),var(--crimson));color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;flex-shrink:0}
.content{padding:20px;max-width:1200px;width:100%;margin:0 auto}
.page-h{margin-bottom:20px}
.page-h h1{font-family:"Cormorant Garamond",serif;font-size:clamp(30px,4vw,40px);color:var(--head);line-height:1.1}
.page-h p{font-size:14px;color:var(--muted)}
.stats{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));margin-bottom:20px}
.stat{position:relative;padding:16px 16px 16px 20px;overflow:hidden}
.stat:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--btn)}
.stat.green:before{background:var(--success)}.stat.red:before{background:var(--danger)}.stat.gold:before{background:var(--gold)}.stat.blue:before{background:var(--info)}
.stat small{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat b{display:block;font-family:"Cormorant Garamond",serif;font-size:32px;line-height:1.2}
.stat i{font-style:normal;font-size:12px;color:var(--muted)}
.panels{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.panel-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
.panel-h h2{font-family:"Cormorant Garamond",serif;font-size:24px;color:var(--head);font-weight:700}
.panel-h a{font-size:12px;color:var(--link-hover)}
.list{list-style:none;padding:0;display:grid;gap:8px;font-size:14px}
.list li{display:flex;justify-content:space-between;gap:8px;align-items:center}
.list.boxed li{background:var(--ivory);border:1px solid var(--line2);border-radius:10px;padding:8px 12px}
.bar{display:grid;grid-template-columns:110px 1fr 52px;gap:8px;align-items:center;font-size:12px;margin-bottom:8px}
.bar .tr{height:10px;border-radius:99px;background:var(--paper);overflow:hidden}
.bar .fi{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--amber),var(--crimson))}
.bar em{font-style:normal;text-align:right;font-weight:600}
.tbl-bar{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:center;padding:14px;border-bottom:1px solid var(--line2)}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:var(--th);color:var(--head);text-align:left;padding:10px 16px;white-space:nowrap}
td{padding:10px 16px;white-space:nowrap;border-top:1px solid var(--line2)}
td.trunc{max-width:260px;overflow:hidden;text-overflow:ellipsis}
tbody tr:hover{background:var(--hover)}
.thumb{width:40px;height:40px;border-radius:8px;object-fit:cover;display:block}
.act button{border:0;background:none;cursor:pointer;color:var(--head);font-size:13px;padding:2px 6px;font-weight:600}
.act .del{color:var(--danger)}
.tbl-foot{display:flex;justify-content:space-between;align-items:center;padding:12px;font-size:12px;color:var(--muted);border-top:1px solid var(--line2);gap:8px}
.pg{display:flex;gap:8px;align-items:center}
.pg button{border:1px solid var(--line-strong);background:var(--surface);border-radius:99px;padding:3px 12px;cursor:pointer;color:var(--ink)}
.pg button:disabled{opacity:.4;cursor:default}
.empty{padding:40px;text-align:center;color:var(--muted)}
.modal{position:fixed;inset:0;z-index:80;background:var(--backdrop);display:grid;place-items:center;padding:16px;animation:fadein .2s ease}
@keyframes fadein{from{opacity:0}}
.modal form,.modal .box{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:24px;width:100%;max-width:560px;display:grid;gap:12px;max-height:92vh;max-height:92dvh;overflow-y:auto;animation:pop .25s ease}
@keyframes pop{from{transform:translateY(16px) scale(.97);opacity:0}}
.modal h3{font-family:"Cormorant Garamond",serif;font-size:26px;color:var(--head)}
.imgfld{display:flex;gap:10px;align-items:flex-start}
.imgfld .prev{width:84px;height:84px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.imgfld .prev[hidden]{display:none}
.tt{overflow-x:auto}.tt table{min-width:720px}
.tt .cell{background:linear-gradient(135deg,rgba(245,158,43,.25),rgba(200,40,30,.12));border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin-bottom:4px}
.tt .cell b{display:block;color:var(--head)}.tt .cell small{color:var(--muted)}
.tt .cell.mine{border-color:var(--link-hover);box-shadow:0 0 0 1px var(--crimson)}
.tt-agenda{display:none}
.note{background:var(--peach);color:var(--head);border-radius:10px;padding:10px 14px;font-size:12px}
.toast{position:fixed;bottom:max(20px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--toast-bg);color:var(--toast-text);padding:10px 18px;border-radius:99px;font-size:14px;z-index:99;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.35);animation:pop .25s ease}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.roster{display:grid;gap:0}
.roster .r{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--line2)}
.roster .r:first-child{border-top:0}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:99px;overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--ink);padding:5px 14px;font-size:13px;cursor:pointer;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button.on.Present{background:var(--success);color:var(--on-success)}
.seg button.on.Late{background:var(--amber);color:#2a1608}
.seg button.on.Absent{background:var(--danger);color:var(--on-danger)}
.seg button.on.Leave{background:var(--info);color:var(--on-info)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .h{font-size:11px;color:var(--muted);text-align:center;font-weight:600}
.cal .d{aspect-ratio:1.25;border-radius:8px;display:grid;place-items:center;font-size:13px;background:var(--paper)}
.cal .d.Present{background:color-mix(in srgb,var(--success) 38%,transparent);font-weight:700}
.cal .d.Late{background:color-mix(in srgb,var(--amber) 45%,transparent);font-weight:700}
.cal .d.Absent{background:color-mix(in srgb,var(--danger) 38%,transparent);font-weight:700}
.cal .d.Leave{background:color-mix(in srgb,var(--info) 38%,transparent);font-weight:700}
.cal .d.blank{background:transparent}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:12px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.perm-tbl td,.perm-tbl th{text-align:center}.perm-tbl td:first-child,.perm-tbl th:first-child{text-align:left}
.lock{font-size:12px;color:var(--muted)}
/* ============ RESPONSIVE ============ */

@media(max-width:1000px){.content{padding:16px}}
@media(max-width:760px){
 .tt-grid{display:none}.tt-agenda{display:grid;gap:14px}

}

 .roster .r{flex-direction:column;align-items:stretch;gap:10px}
 .seg{width:100%}.seg button{flex:1;padding:9px 4px}
 .bar{grid-template-columns:84px 1fr 44px}

 .tabs,.chips{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;padding-bottom:6px;-webkit-overflow-scrolling:touch}

 table.stack thead{display:none}
 table.stack,table.stack tbody,table.stack tr,table.stack td{display:block;width:100%}

 table.stack td:before{content:attr(data-l);font-weight:600;color:var(--head);text-align:left;flex-shrink:0}
 table.stack td.trunc{max-width:none}
 table.stack td:empty{display:none}
 .tbl-wrap{overflow:visible}
 .pub-foot .g{padding:24px 14px}
}
@media(max-width:520px){.hide-xs{display:none}}
@media(max-width:400px){.logo small{display:none}.page-h h1{font-size:28px}.stats{grid-template-columns:1fr 1fr;gap:10px}.stat{padding:12px 12px 12px 16px}.stat b{font-size:24px}}
@media(pointer:coarse){.btn.sm{min-height:40px}.chip{min-height:38px}.seg button{min-height:42px}.act button{min-height:36px;padding:2px 10px}.pg button{min-height:36px}.snav a{padding:11px 12px}.burger{min-width:44px;min-height:44px}}
@media(hover:none){.cat-card.rv.in:hover,.grid>.card.rv.in:hover{transform:none;box-shadow:var(--shadow)}.snav a:hover{transform:none}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}.rv{opacity:1!important;transform:none!important}.par{transform:none!important}.shine{-webkit-text-fill-color:#fff;color:#fff;background:none}}
/* ===== v5: photography, 3D & hand-made motion ===== */
.cover{object-position:50% 22%}
img.broken{display:none}
.hero-home{position:relative;overflow:hidden}
.hero-home .wrap{position:relative;z-index:1}
.hero-photo{position:absolute;inset:-6% 0;background-size:cover;background-position:center 35%;opacity:.2;mix-blend-mode:luminosity;transform:translate3d(0,var(--py,0px),0) scale(1.08);pointer-events:none}
.hero-points{list-style:none;padding:0;margin-top:22px;display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px;color:rgba(255,255,255,.82)}
.hero-points li:before{content:"✦ ";color:var(--amber)}
.scene-wrap{perspective:1100px;padding:18px 0}
.scene{position:relative;max-width:420px;margin-inline:auto;transform-style:preserve-3d;will-change:transform}
.scene .par{transform:translate3d(0,var(--py,0px),44px);transform-style:preserve-3d}
.hero-img.arch{border-radius:999px 999px 28px 28px;aspect-ratio:4/5.1;background:linear-gradient(160deg,#5b2a86,#c8281e);border:5px solid rgba(255,255,255,.28)}
.mandala{position:absolute;left:-14%;top:-4%;width:128%;height:auto;color:var(--amber);opacity:.75;transform:translateZ(-80px);animation:mspin 110s linear infinite;pointer-events:none}
.mandala path,.mandala circle{vector-effect:non-scaling-stroke}
.mandala path{stroke-dasharray:1;stroke-dashoffset:1;animation:mdraw 2.6s cubic-bezier(.5,0,.2,1) forwards;animation-delay:calc(var(--i,0)*.14s + .3s)}
.orn .mandala{position:static;width:100%;opacity:.55;transform:none;animation:mspin 140s linear infinite}
.orn .mandala path{stroke-dashoffset:0;animation:none}
.art.orn{color:var(--gold)}
@keyframes mspin{to{rotate:360deg}}
@keyframes mdraw{to{stroke-dashoffset:0}}
/* hanging ghungroo strings */
.strings{position:absolute;inset:0 0 auto 0;height:0;z-index:2;pointer-events:none}
.str{position:absolute;top:0;transform-origin:50% 0;rotate:calc(var(--vel,0)*1deg);transition:rotate .5s cubic-bezier(.3,1.7,.5,1)}
.str .sw{transform-origin:50% 0;animation:swingk var(--du,4s) ease-in-out var(--dl,0s) infinite alternate}
.str .cord{display:block;width:2px;height:var(--len,110px);margin:0 auto;background:linear-gradient(#e8c987,#a47e3a);border-radius:2px}
.str .gb{display:block;width:15px;height:15px;margin:2px auto 0;border-radius:50%;background:radial-gradient(circle at 32% 30%,#fff3c4,#d7ad5f 55%,#8f6a28);box-shadow:0 3px 8px rgba(0,0,0,.35);position:relative}
.str .gb:after{content:"";position:absolute;left:50%;top:52%;width:5px;height:1.5px;background:rgba(60,30,0,.55);transform:translateX(-50%);border-radius:2px}
@keyframes swingk{from{transform:rotate(-5deg)}50%{transform:rotate(1.5deg)}to{transform:rotate(6deg)}}
@media(max-width:900px){.str:nth-child(-n+2){display:none}}
/* marigold petals */
.petals{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:1}
.petal{position:absolute;top:-30px;width:14px;height:20px;border-radius:70% 0 70% 0;background:linear-gradient(135deg,#ffc247,#f26a21);opacity:.8;scale:var(--s,1);animation:petalfall var(--dur,12s) linear var(--dl,0s) infinite}
@keyframes petalfall{0%{transform:translate3d(0,-30px,0) rotate3d(1,1,0,0deg)}25%{transform:translate3d(calc(var(--dx)*.6),22vh,0) rotate3d(1,.3,.5,120deg)}55%{transform:translate3d(calc(var(--dx)*-.3),55vh,0) rotate3d(.4,1,.2,300deg)}100%{transform:translate3d(var(--dx),115vh,0) rotate3d(.2,1,.6,560deg)}}
/* hand-drawn underline */
.sec-title .scribble{display:block;width:170px;height:12px;margin:8px auto 0;color:var(--gold)}
.scribble path{fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.2s cubic-bezier(.5,0,.2,1) .35s}
.sec-title.in .scribble path{stroke-dashoffset:0}
/* page-turn reveals with a little overshoot */
.rv{transform:perspective(900px) translateY(36px) rotateX(10deg);transform-origin:50% 100%;transition:opacity .8s ease var(--d,0s),transform 1s cubic-bezier(.22,1.15,.36,1) var(--d,0s),rotate 1s cubic-bezier(.22,1.3,.36,1) var(--d,0s)}
.rv.rv-l{transform:perspective(900px) translateX(-56px) rotateY(14deg)}
.rv.rv-r{transform:perspective(900px) translateX(56px) rotateY(-14deg)}
.rv.rv-z{transform:perspective(900px) scale(.84) rotateX(12deg)}
.rv.in{transform:none}
.rv.done{transition:opacity .4s ease,box-shadow .3s ease}
.tiles .tile.rv{rotate:var(--r,0deg)}
.tiles .tile.rv.in{rotate:0deg}
[data-tilt]{position:relative;transform-style:preserve-3d}
[data-tilt]:after{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(circle at var(--gx,50%) var(--gy,50%),rgba(255,255,255,.24),transparent 58%);opacity:0;transition:opacity .35s;pointer-events:none}
[data-tilt].tilting:after{opacity:1}
/* about: hand-placed photo stack */
.photo-stack{position:relative;aspect-ratio:1;max-width:360px;width:100%;margin-inline:auto}
.photo-stack figure{position:absolute;width:64%;aspect-ratio:4/5;margin:0;padding:8px 8px 26px;background:#fffaf0;border-radius:6px;box-shadow:0 18px 40px rgba(0,0,0,.35);rotate:var(--r)}
.photo-stack figure:first-child{left:0;top:0}
.photo-stack figure:last-child{right:0;bottom:0}
.photo-stack img{width:100%;height:100%;object-fit:cover;border-radius:3px;display:block}
.ghost-word{position:absolute;left:0;top:50%;white-space:nowrap;font-family:"Cormorant Garamond",Georgia,serif;font-size:clamp(84px,17vw,230px);line-height:1;color:transparent;-webkit-text-stroke:1px color-mix(in srgb,var(--gold) 38%,transparent);transform:translate3d(var(--px,0px),-50%,0);pointer-events:none;user-select:none}
.intro{position:relative;overflow:hidden}
.intro .wrap{position:relative;z-index:1}
.guru-ph .mono{display:grid;place-items:center;width:100%;height:100%;font-family:"Cormorant Garamond",Georgia,serif;font-size:56px;color:var(--head);background:radial-gradient(circle at 30% 25%,color-mix(in srgb,var(--gold) 45%,transparent),transparent 70%)}
.login-ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.5}
.login .left:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,8,36,.2),rgba(20,8,36,.85))}
.login .left p{z-index:2}
.pub-foot .credits{font-size:11px;opacity:.8;line-height:1.5;padding-top:0}
.sticky-cta{display:none}
@media(max-width:760px){.sticky-cta{display:inline-flex;position:fixed;left:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:60;padding:12px 18px;border-radius:999px;background:var(--btn,#e0b865);color:#2a1450;font-weight:700;font-size:14px;box-shadow:0 10px 26px rgba(0,0,0,.4);transform:translateY(90px);opacity:0;transition:transform .5s cubic-bezier(.22,1.3,.36,1),opacity .3s}.sticky-cta.show{transform:none;opacity:1}}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
@media(prefers-reduced-motion:reduce){.petals,.strings,.mandala{display:none}.scene{transform:none!important}.rv.rv-l,.rv.rv-r,.rv.rv-z{transform:none}}
/* ===== v6: professional dance-school layout + extra scroll choreography ===== */
.ann{background:linear-gradient(90deg,#5c0f0b,#8f1d14 50%,#5c0f0b);color:#f6e4b8;text-align:center;font-size:12.5px;letter-spacing:.06em;padding:8px 14px}
.ann a{color:#fff;font-weight:700;text-decoration:underline;text-underline-offset:3px}
.eyebrow{display:block;font-size:12px;letter-spacing:.34em;text-transform:uppercase;color:var(--amber);font-weight:600;margin-bottom:6px}
.hero-home h1.shine{clip-path:inset(-12% 100% -25% -2%);animation:wipe 1.5s cubic-bezier(.6,0,.2,1) .25s forwards}
@keyframes wipe{to{clip-path:inset(-12% -4% -25% -2%)}}
.page-hero h1 .w{display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:.12em}
.page-hero h1 .w>span{display:inline-block;transform:translateY(115%);animation:wup .95s cubic-bezier(.22,1.2,.36,1) calc(var(--i)*.13s + .15s) forwards}
@keyframes wup{to{transform:none}}
[data-mag]{transition:transform .55s cubic-bezier(.3,1.7,.5,1)}
/* stats */
.stats-strip{background:linear-gradient(180deg,rgba(0,0,0,.18),rgba(0,0,0,0));border-block:1px solid var(--line);padding:34px 0}
.stats-strip .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:960px}
.stat{text-align:center;padding:6px 8px;position:relative}
.stat+.stat:before{content:"";position:absolute;left:0;top:18%;height:64%;width:1px;background:var(--line)}
.stat b{display:block;font-family:"Cormorant Garamond",Georgia,serif;font-size:clamp(44px,6vw,68px);line-height:1;color:var(--head);font-weight:600}
.stat span{font-size:11.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);font-weight:600}
@media(max-width:560px){.stats-strip .wrap{grid-template-columns:repeat(2,1fr);row-gap:22px}.stat:nth-child(3):before{display:none}}
/* why */
.why-card{padding:26px 22px;display:grid;gap:10px;align-content:start}
.why-card h3{font-family:"Cormorant Garamond",Georgia,serif;font-size:27px;color:var(--head);line-height:1.1}
.why-card p{font-size:14.5px;color:var(--muted)}
.why-ic{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:color-mix(in srgb,var(--gold) 16%,transparent);border:1px solid color-mix(in srgb,var(--gold) 45%,transparent)}
.why-ic svg{width:28px;height:28px;color:var(--gold)}
.why-ic path{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.4s cubic-bezier(.5,0,.2,1) .4s}
.why-card.in .why-ic path{stroke-dashoffset:0}
/* programme image curtain */
.cat-card .cat-img img{clip-path:inset(0 0 100% 0);scale:1.3;transition:clip-path 1.1s cubic-bezier(.65,0,.2,1) .15s,scale 1.6s cubic-bezier(.2,.7,.2,1) .15s,transform .7s ease}
.cat-card.in .cat-img img{clip-path:inset(0);scale:1}
/* scroll-driven outline marquee */
.smq{overflow:hidden;padding:26px 0;border-block:1px solid var(--line);background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--gold) 7%,transparent),transparent)}
.smq>div{white-space:nowrap;font-family:"Cormorant Garamond",Georgia,serif;font-size:clamp(54px,9vw,120px);line-height:1.05;color:transparent;-webkit-text-stroke:1px color-mix(in srgb,var(--gold) 55%,transparent);transform:translate3d(var(--px,0px),0,0);margin-left:-25%;width:max-content}
.smq>div.alt{color:color-mix(in srgb,var(--gold) 22%,transparent);-webkit-text-stroke:0;margin-left:-60%}
/* learning journey */
.path{list-style:none;padding:0;margin:0 auto;max-width:860px;position:relative;display:grid;gap:34px}
.path .line{position:absolute;left:22px;top:6px;bottom:6px;width:3px;border-radius:3px;background:var(--line)}
.path .line i{position:absolute;left:0;top:0;width:100%;height:calc(var(--prog,0)*100%);background:linear-gradient(var(--amber),var(--gold));border-radius:3px;box-shadow:0 0 14px color-mix(in srgb,var(--amber) 70%,transparent)}
.path li.step{position:relative;padding-left:64px}
.path li.step:before{content:attr(data-n);position:absolute;left:0;top:0;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-family:"Cormorant Garamond",Georgia,serif;font-size:24px;font-weight:700;color:var(--head);background:var(--bg2);border:2px solid var(--line);transition:all .6s cubic-bezier(.3,1.7,.5,1)}
.path li.step.on:before{background:var(--btn,#e0b865);color:#2a1450;border-color:var(--amber);transform:scale(1.14);box-shadow:0 0 0 7px color-mix(in srgb,var(--amber) 22%,transparent)}
.path .step .card{padding:18px 20px}
.path .step h3{font-family:"Cormorant Garamond",Georgia,serif;font-size:28px;color:var(--head)}
.path .step p{color:var(--muted);font-size:15px;margin-top:4px}
@media(min-width:900px){.path .line{left:50%;margin-left:-1.5px}.path li.step{width:50%;padding:0 56px 0 0;text-align:right}.path li.step:nth-child(odd):before{left:auto;right:-23px}.path li.step:nth-child(even){margin-left:50%;padding:0 0 0 56px;text-align:left}.path li.step:nth-child(even):before{left:-23px}}
/* pinned horizontal film strip */
.film{position:relative}
.film-pin{position:sticky;top:96px;overflow:hidden}
.film-track{display:flex;gap:18px;width:max-content;padding:6px 4px;transform:translate3d(var(--fx,0px),0,0)}
.film-track .tile{width:clamp(250px,24vw,340px);aspect-ratio:4/5;flex:none}
.film-bar{height:3px;background:var(--line);border-radius:3px;margin:18px auto 0;max-width:420px;overflow:hidden}
.film-bar i{display:block;height:100%;width:calc(var(--fp,0)*100%);background:var(--amber)}
@media(max-width:899px){.film{height:auto!important}.film-pin{position:static;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;padding-bottom:8px}.film-track{transform:none;padding-inline:16px}.film-track .tile{scroll-snap-align:center;width:72vw;max-width:300px}.film-bar{display:none}}
/* FAQ */

function fld(col,n){

const tmin=t=>{const m=/(\d+):(\d+)\s*(AM|PM)?/i.exec(t||"");if(!m)return 0;let h=+m[1]%12;if((m[3]||"").toUpperCase()==="PM")h+=12;return h*60+ +m[2]};
function weekly(slots,mine){const days=["Mon","Tue","Wed","Thu","Fri","Sat"];if(slots.some(s=>s[0]==="Sun"))days.push("Sun");const times=[...new Set(slots.map(s=>s[1]))].sort((a,b)=>tmin(a)-tmin(b));
if(!times.length)return'<div class="card empty">No classes scheduled.</div>';
const cell=c=>`<div class="cell ${mine&&mine(c)?"mine":""}"><b>${esc(c[2])}</b><small>${esc(c[3])} · ${esc(c[4])}</small></div>`;
const grid=`<div class="card tt tt-grid"><table><thead><tr><th>Time</th>${days.map(d=>`<th>${d}</th>`).join("")}</tr></thead><tbody>${times.map(t=>`<tr><td class="muted" style="font-weight:600">${esc(t)}</td>${days.map(d=>`<td style="vertical-align:top">${slots.filter(x=>x[0]===d&&x[1]===t).map(cell).join("")}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
const agenda=`<div class="tt-agenda">${days.map(d=>{const L=slots.filter(x=>x[0]===d).sort((a,b)=>tmin(a[1])-tmin(b[1]));return L.length?`<div class="card pad"><h3 class="display" style="font-size:24px;color:var(--head);margin-bottom:8px">${d}${d===todayName()?" · Today":""}</h3><ul class="list boxed">${L.map(c=>`<li><span><b style="color:var(--head)">${esc(c[2])}</b><br><small class="muted">${esc(c[3])} · ${esc(c[4])}</small></span><span class="badge b-warn">${esc(c[1])}</span></li>`).join("")}</ul></div>`:""}).join("")}</div>`;
return grid+agenda}
function timetableView(a){let slots=S.t.tt,desc="Weekly class schedule.",mine=null;

return`<div class="card pad"><div class="row" style="justify-content:space-between;align-items:flex-start"><div><h2 class="display" style="font-size:28px;color:var(--head)">${esc(k[1])}</h2><p class="muted" style="font-size:12px">${esc(k[0])} · ${esc(k[2])}</p></div>${due>0?`<span class="badge b-warn">Due ${fmt(due)}</span>`:'<span class="badge b-success">No dues</span>'}</div><div style="margin:14px 0">${bars([["Attendance",p]],"%",100)}</div><p style="font-size:14px" class="muted">Next class: <b style="color:var(--ink)">${nx?nx[0]+" "+nx[1]+" · "+nx[4]:"—"}</b></p><div class="row" style="margin-top:14px"><button class="btn ghost sm" data-kidgo="${k[0]}">Attendance</button><a class="btn sm" href="#/portal/fees">Fees</a></div></div>`}).join("");

let io=null,ticking=false;
function initFX(){if(io){io.disconnect();io=null}
 const reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
 const sel=".page-hero .in>*,main .sec-title,main section .chips,main .grid>*,main .tiles>*,.hero-grid>*,main .marquee,.content .page-h,.content .stats>*,.content .panels>*,.content>.card,.content>.tabs,.content>.tt-grid,.content>.tt-agenda";
 const els=[...document.querySelectorAll(sel)],cnt=new Map();
 if(!("IntersectionObserver" in window)||reduce){els.forEach(e=>e.classList.add("rv","in","done"));return}
 counters();
 io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){const tg=x.target;tg.classList.add("in");setTimeout(()=>tg.classList.add("done"),1500);io.unobserve(tg)}}),{threshold:.08,rootMargin:"0px 0px -6% 0px"});
 els.forEach(e=>{if(e.classList.contains("rv"))return;const p=e.parentElement,i=cnt.get(p)||0;cnt.set(p,i+1);
  const two=p.classList.contains("g2")||p.classList.contains("hero-grid");
  e.classList.add("rv");if(e.classList.contains("tile"))e.style.setProperty("--r",((Math.random()*2-1)*5).toFixed(1)+"deg");if(two)e.classList.add(i===0?"rv-l":"rv-r");else if(e.classList.contains("tile"))e.classList.add("rv-z");

async function apiFetch(path,o){o=o||{};const hd={};if(o.body!==undefined)hd["Content-Type"]="application/json";if(api.token)hd.Authorization="Bearer "+api.token;const ac=new AbortController(),to=setTimeout(()=>ac.abort(),o.timeout||20000);

const errMsg=r=>r.status===0?"Cannot reach the server. Check your connection.":(r.data&&typeof r.data.detail==="string"?r.data.detail:"Something went wrong. Please try again.");

/* change tracking: diff the live state against the last state the server confirmed */
const KS="\x1f",rowKey=(t,r)=>SCHEMA[t].key.map(i=>String(r[i]==null?"":r[i])).join(KS);
function takeSnapshot(){if(!SCHEMA)return;SNAP={t:{},site:JSON.stringify(S.site),settings:JSON.stringify(S.settings)};for(const t of Object.keys(SCHEMA)){if(t==="audit"||!S.t[t])continue;SNAP.t[t]=SCHEMA[t].mode==="replace"?JSON.stringify(S.t[t]):new Map(S.t[t].map(r=>[rowKey(t,r),JSON.stringify(r)]))}}

 for(const t of Object.keys(SCHEMA)){if(t==="audit"||!SNAP.t[t])continue;const sp=SCHEMA[t],cur=S.t[t]||[];
  if(sp.mode==="replace"){const j=JSON.stringify(cur);if(j!==SNAP.t[t]){tables[t]={rows:cur,version:VER[t]};any=true}continue}
  const old=SNAP.t[t],seen=new Set(),up=[],rem=[];
  cur.forEach((r,i)=>{const k=rowKey(t,r);seen.add(k);const o=old.get(k),js=JSON.stringify(r);if(o===undefined)up.push({row:r,new:true,front:i===0&&cur.length>1});else if(o!==js)up.push({row:r,new:false})});

  if(up.length||rem.length){tables[t]={upsert:up,remove:rem};any=true}}

  else if(r.status===409&&r.data&&r.data.rejected){toast("Not saved: "+r.data.rejected[0].reason);await refetch();render();break}
